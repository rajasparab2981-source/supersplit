<!-- SplitPro sign-in email (used for both first sign-up and later sign-ins). -->
<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 460px; margin: 0 auto; padding: 24px; color: #111;">
  <h2 style="margin: 0 0 8px; font-size: 20px;">Sign in to SplitPro</h2>
  <p style="margin: 0 0 20px; color: #444; font-size: 15px;">Type this code in the app:</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 800; letter-spacing: 6px; font-family: Menlo, Consolas, monospace;">{{ .Token }}</p>
  <p style="margin: 0 0 12px; color: #444; font-size: 15px;">Or tap this button on the device where you want to be signed in:</p>
  <p style="margin: 0 0 28px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #00C98C; color: #0A1A14; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 999px;">Sign in to SplitPro</a>
  </p>
  <p style="margin: 0; color: #888; font-size: 12px;">The code and link expire in 1 hour. If you didn't ask to sign in, you can ignore this email.</p>
</div>
