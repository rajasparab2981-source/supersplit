    // ---------- Simple action menu (kebab popover) ----------
    function ActionsSheet({ open, onClose, title, actions }) {
      // actions: [{ label, danger, onClick, icon }]
      return (
        <Sheet open={open} onClose={onClose} title={title || 'Actions'}>
          {actions.map((a, i) => (
            <button
              key={i}
              onClick={() => { a.onClick(); }}
              style={{
                width: '100%', display: 'flex', alignItems: 'center', gap: 12,
                padding: '16px 18px',
                background: 'var(--surface)',
                border: '1px solid ' + (a.danger ? 'rgba(255,77,109,.25)' : 'var(--border)'),
                borderRadius: 'var(--r-2)',
                color: a.danger ? 'var(--negative)' : 'var(--text)',
                fontFamily: 'Manrope', fontWeight: 600, fontSize: 15,
                textAlign: 'left',
                marginBottom: 8,
                cursor: 'pointer',
                transition: 'background .15s ease',
              }}
            >
              {a.icon || null}
              <span style={{ flex: 1 }}>{a.label}</span>
            </button>
          ))}
          <div className="spacer-1" />
          <button className="btn btn-ghost btn-full" onClick={onClose}>Cancel</button>
          <div className="spacer-1" />
        </Sheet>
      );
    }

    function Sheet({ open, onClose, title, onSave, saveLabel = 'Save', canSave = true, children }) {
      if (!open) return null;
      return (
        <React.Fragment>
          <div className="scrim" onClick={onClose} />
          <div className="sheet" role="dialog" aria-modal="true">
            <div className="sheet-handle" />
            <div className="sheet-header">
              <button className="sheet-cancel" onClick={onClose}>Cancel</button>
              <h3 className="sheet-title">{title}</h3>
              {onSave ? (
                <button className="sheet-save" onClick={onSave} disabled={!canSave}>{saveLabel}</button>
              ) : <span style={{ width: 56 }} />}
            </div>
            <div className="sheet-body">{children}</div>
          </div>
        </React.Fragment>
      );
    }

    function EmojiPicker({ pool, value, onChange }) {
      return (
        <div className="emoji-picker">
          {pool.map((em) => (
            <button key={em} type="button"
              className={`emoji-cell ${em === value ? 'active' : ''}`}
              onClick={() => onChange(em)}>{em}</button>
          ))}
        </div>
      );
    }
    function ColorPicker({ value, onChange }) {
      return (
        <div className="swatches">
          {COLORS.map((c) => (
            <button key={c} type="button"
              className={`swatch ${c === value ? 'active' : ''}`}
              style={{ background: `linear-gradient(135deg, ${c} 0%, color-mix(in srgb, ${c} 60%, #000) 100%)` }}
              onClick={() => onChange(c)} aria-label={`Color ${c}`} />
          ))}
        </div>
      );
    }

    function Header({ title, subtitle, onBack, onSettings, onCalc, syncStatus }) {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 4);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <header className={`app-header ${scrolled ? 'scrolled' : ''}`}>
          <div style={{ width: 44, display: 'flex', alignItems: 'center' }}>
            {onBack ? <button className="icon-btn" onClick={onBack} aria-label="Back"><Icon.Back /></button> : null}
          </div>
          <div style={{ textAlign: 'center', flex: 1, minWidth: 0, padding: '0 8px' }}>
            <h1>{title}</h1>
            {subtitle ? <p className="crumb">{subtitle}</p> : null}
          </div>
          <div style={{ width: 92, display: 'flex', justifyContent: 'flex-end', alignItems: 'center', gap: 2 }}>
            {syncStatus === 'live' && (
              <span title="Live sync" style={{ width: 8, height: 8, borderRadius: 999, background: 'var(--primary)', boxShadow: '0 0 8px var(--primary)', marginRight: 4 }} />
            )}
            {onCalc ? <button className="icon-btn" onClick={onCalc} aria-label="Calculator"><Icon.Calc /></button> : null}
            {onSettings ? <button className="icon-btn" onClick={onSettings} aria-label="Settings"><Icon.Gear /></button> : null}
          </div>
        </header>
      );
    }

    // ---------- Home: groups ----------
    function GroupsView({ groups, groupSummaries, onOpen, onAdd }) {
      const overallNet = useMemo(() => Object.values(groupSummaries).reduce((s, x) => s + (x?.net || 0), 0), [groupSummaries]);
      const totalSpent = useMemo(() => Object.values(groupSummaries).reduce((s, x) => s + (x?.totalSpent || 0), 0), [groupSummaries]);
      const anySelf = useMemo(() => Object.values(groupSummaries).some((x) => x?.hasSelf), [groupSummaries]);
      const hasAny = groups.length > 0;

      return (
        <React.Fragment>
          {hasAny && (
            <div className="summary">
              <div className="grain" />
              <p className="label">{anySelf ? 'Your overall balance' : 'Total tracked'}</p>
              {anySelf ? (
                <React.Fragment>
                  <p className={`net ${Math.abs(overallNet) < 0.5 ? 'zero' : overallNet > 0 ? 'pos' : 'neg'}`}>
                    {Math.abs(overallNet) < 0.5 ? fmtINR(0) : (overallNet > 0 ? '+' : '−') + fmtINR(Math.abs(overallNet))}
                  </p>
                  <p className="sub">
                    {Math.abs(overallNet) < 0.5 ? 'You\'re all settled up' : overallNet > 0 ? 'You are owed across all groups' : 'You owe across all groups'}
                  </p>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p className="net pos">{fmtINR(totalSpent)}</p>
                  <p className="sub">Across {groups.length} group{groups.length === 1 ? '' : 's'} · pick yourself in a group to see "you owe"</p>
                </React.Fragment>
              )}
            </div>
          )}

          {groups.length === 0 ? (
            <div className="empty">
              <div className="emoji-bubble">👥</div>
              <h3>Start a new group</h3>
              <p>Create your first split — track everything from chai runs to weekend trips.</p>
              <div className="spacer-3" />
              <button className="btn btn-primary" onClick={onAdd}><Icon.Plus /> New group</button>
            </div>
          ) : (
            <React.Fragment>
              <p className="section-title">Your groups</p>
              <div>
                {groups.map((g) => {
                  const s = groupSummaries[g.id] || { totalSpent: 0, net: 0, hasSelf: false };
                  return (
                    <div key={g.id} className="row" style={{ '--accent-color': g.color }} onClick={() => onOpen(g.id)}>
                      <span className="row-emoji" style={{ '--accent-color': g.color }}>{g.emoji}</span>
                      <div className="row-main">
                        <p className="row-title">{g.name}</p>
                        <p className="row-sub">{s.totalSpent > 0 ? `${fmtINR(s.totalSpent)} spent` : 'No expenses yet'}</p>
                      </div>
                      <div className="row-balance">
                        {s.hasSelf ? (
                          <React.Fragment>
                            <div className="b-label">{Math.abs(s.net) < 0.5 ? 'settled' : s.net > 0 ? 'you\'re owed' : 'you owe'}</div>
                            <div className={`b-amt ${Math.abs(s.net) < 0.5 ? 'zero' : s.net > 0 ? 'pos' : 'neg'}`}>
                              {Math.abs(s.net) < 0.5 ? '—' : fmtINR(Math.abs(s.net))}
                            </div>
                          </React.Fragment>
                        ) : (
                          <div className="b-label">tap to view</div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </React.Fragment>
          )}

          <div className="spacer-fab" />
          <button className="fab" onClick={onAdd} aria-label="Add group"><Icon.Plus /></button>
        </React.Fragment>
      );
    }

    // ---------- Group view ----------
    function GroupView({ group, members, trips, self, tripSummaries, onOpenTrip, onAddMember, onRemoveMember, onAddTrip, onDeleteGroup, onChangeSelf, onOpenActions }) {
      const totalSpent = useMemo(() => Object.values(tripSummaries).reduce((s, x) => s + (x?.totalSpent || 0), 0), [tripSummaries]);
      const net = useMemo(() => Object.values(tripSummaries).reduce((s, x) => s + (x?.net || 0), 0), [tripSummaries]);
      const youGet = useMemo(() => Object.values(tripSummaries).reduce((s, x) => s + Math.max(0, x?.net || 0), 0), [tripSummaries]);
      const youOwe = useMemo(() => Object.values(tripSummaries).reduce((s, x) => s + Math.max(0, -(x?.net || 0)), 0), [tripSummaries]);

      return (
        <React.Fragment>
          {members.length > 0 && (
            <div className="self-bar">
              <span className="self-label">I am</span>
              <span className="self-current">
                {self ? (
                  <React.Fragment><Avatar name={self} size="sm" /> {self}</React.Fragment>
                ) : (
                  <span style={{ color: 'var(--text-mute)' }}>not set</span>
                )}
              </span>
              <button onClick={onChangeSelf}>{self ? 'Change' : 'Pick'}</button>
            </div>
          )}

          {/* Hero */}
          <div className="summary" style={{
            background: `radial-gradient(120% 100% at 0% 0%, ${group.color}30 0%, transparent 60%), radial-gradient(100% 80% at 100% 100%, ${group.color}20 0%, transparent 60%), linear-gradient(140deg, #15151E 0%, #1C1C2C 100%)`,
            borderColor: `${group.color}40`,
          }}>
            <div className="grain" />
            <button
              onClick={onOpenActions}
              aria-label="Group actions"
              style={{
                position: 'absolute', top: 12, right: 12,
                width: 36, height: 36, borderRadius: 999,
                background: 'rgba(0,0,0,.25)',
                color: 'rgba(255,255,255,.8)',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                border: '1px solid rgba(255,255,255,.08)',
                backdropFilter: 'blur(8px)',
                zIndex: 2,
                cursor: 'pointer',
              }}
            ><Icon.More /></button>
            <p className="label" style={{ color: group.color }}>{group.emoji} {group.name}</p>
            {self ? (
              <React.Fragment>
                <p className={`net ${Math.abs(net) < 0.5 ? 'zero' : net > 0 ? 'pos' : 'neg'}`}>
                  {Math.abs(net) < 0.5 ? fmtINR(0) : (net > 0 ? '+' : '−') + fmtINR(Math.abs(net))}
                </p>
                <p className="sub">
                  {Math.abs(net) < 0.5 ? 'You\'re settled in this group' : net > 0 ? 'You are owed (net)' : 'You owe (net)'}
                </p>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="net" style={{ color: group.color }}>{fmtINR(totalSpent)}</p>
                <p className="sub">Total spent · pick yourself for personalized balance</p>
              </React.Fragment>
            )}
            <div className="summary-split">
              <div>
                <div className="col-label">You're owed</div>
                <div className="col-amt pos">{fmtINR(youGet)}</div>
              </div>
              <div>
                <div className="col-label">You owe</div>
                <div className="col-amt neg">{fmtINR(youOwe)}</div>
              </div>
              <div>
                <div className="col-label">Total spent</div>
                <div className="col-amt" style={{ color: 'var(--text)' }}>{fmtINR(totalSpent)}</div>
              </div>
            </div>
          </div>

          <div className="section-row">
            <p className="section-title">Members</p>
            <button className="add-btn" onClick={onAddMember}>+ Add</button>
          </div>

          {members.length === 0 ? (
            <div className="row" style={{ '--accent-color': 'var(--text-faint)', cursor: 'default' }}>
              <div className="row-main">
                <p className="row-sub" style={{ color: 'var(--text-soft)', textTransform: 'none', letterSpacing: 0, fontSize: 14 }}>
                  Add members to start splitting expenses.
                </p>
              </div>
            </div>
          ) : (
            <div style={{ padding: '8px 8px 4px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--r-3)' }}>
              <div className="chips" style={{ padding: 8 }}>
                {members.map((m) => (
                  <span key={m.id} className="member-pill">
                    <Avatar name={m.name} />
                    {m.name === self && <span className="you-tag" style={{ color: 'var(--primary)' }}>YOU</span>}
                    {m.name}
                    <button className="x" onClick={() => onRemoveMember(m)} aria-label={`Remove ${m.name}`}>✕</button>
                  </span>
                ))}
              </div>
            </div>
          )}

          <div className="section-row">
            <p className="section-title">Trips & plans</p>
            <button className="add-btn" onClick={onAddTrip}>+ Add</button>
          </div>

          {trips.length === 0 ? (
            <div className="row" style={{ '--accent-color': 'var(--text-faint)', cursor: 'default' }}>
              <div className="row-main">
                <p className="row-sub" style={{ color: 'var(--text-soft)', textTransform: 'none', letterSpacing: 0, fontSize: 14 }}>
                  No trips yet. Create one to start adding expenses.
                </p>
              </div>
            </div>
          ) : (
            <div>
              {trips.map((t) => {
                const ts = tripSummaries[t.id] || { totalSpent: 0, net: 0, hasSelf: false };
                return (
                  <div key={t.id} className="row" style={{ '--accent-color': group.color }} onClick={() => onOpenTrip(t.id)}>
                    <span className="row-emoji" style={{ '--accent-color': group.color }}>{t.emoji}</span>
                    <div className="row-main">
                      <p className="row-title">{t.name}</p>
                      <p className="row-sub">{ts.totalSpent > 0 ? `${fmtINR(ts.totalSpent)} spent` : 'No expenses yet'}</p>
                    </div>
                    <div className="row-balance">
                      {ts.hasSelf && Math.abs(ts.net) >= 0.5 ? (
                        <React.Fragment>
                          <div className="b-label">{ts.net > 0 ? 'you\'re owed' : 'you owe'}</div>
                          <div className={`b-amt ${ts.net > 0 ? 'pos' : 'neg'}`}>{fmtINR(Math.abs(ts.net))}</div>
                        </React.Fragment>
                      ) : (
                        <div className="b-label">{ts.hasSelf ? 'settled' : 'tap to view'}</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <div className="spacer-fab" />
        </React.Fragment>
      );
    }

    // ---------- Trip view ----------
    function TripView({ group, trip, members, expenses, self, onAddExpense, onEditExpense, onDeleteTrip, onPay, onOpenActions, onReact }) {
      const [tab, setTab] = useState('expenses');
      const total = useMemo(() => expenses.reduce((s, e) => s + Number(e.amount || 0), 0), [expenses]);
      const balances = useMemo(() => calcBalances(expenses), [expenses]);
      const settlements = useMemo(() => calcSettlements(balances), [balances]);
      const youNet = self ? (balances.find((b) => b.name === self)?.net || 0) : 0;

      // Celebrate when transitioning from "had transfers" → "fully settled" for this trip
      const [celebrating, setCelebrating] = useState(false);
      const prevSettleCountRef = React.useRef(settlements.length);
      const lastTripIdRef = React.useRef(trip.id);
      useEffect(() => {
        // Reset tracking when switching trips so we don't celebrate on initial mount
        if (lastTripIdRef.current !== trip.id) {
          lastTripIdRef.current = trip.id;
          prevSettleCountRef.current = settlements.length;
          return;
        }
        if (prevSettleCountRef.current > 0 && settlements.length === 0 && expenses.length > 0) {
          setCelebrating(true);
          const t = setTimeout(() => setCelebrating(false), 2700);
          prevSettleCountRef.current = settlements.length;
          return () => clearTimeout(t);
        }
        prevSettleCountRef.current = settlements.length;
      }, [settlements.length, expenses.length, trip.id]);

      return (
        <React.Fragment>
          <div className="summary" style={{
            background: `radial-gradient(120% 100% at 0% 0%, ${group.color}28 0%, transparent 60%), radial-gradient(100% 80% at 100% 100%, ${group.color}1A 0%, transparent 60%), linear-gradient(140deg, #15151E 0%, #1C1C2C 100%)`,
            borderColor: `${group.color}40`,
          }}>
            <div className="grain" />
            <button
              onClick={onOpenActions}
              aria-label="Trip actions"
              style={{
                position: 'absolute', top: 12, right: 12,
                width: 36, height: 36, borderRadius: 999,
                background: 'rgba(0,0,0,.25)',
                color: 'rgba(255,255,255,.8)',
                display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                border: '1px solid rgba(255,255,255,.08)',
                backdropFilter: 'blur(8px)',
                zIndex: 2,
                cursor: 'pointer',
              }}
            ><Icon.More /></button>
            <p className="label" style={{ color: group.color }}>{trip.emoji} {trip.name}</p>
            {self ? (
              <React.Fragment>
                <p className={`net ${Math.abs(youNet) < 0.5 ? 'zero' : youNet > 0 ? 'pos' : 'neg'}`}>
                  {Math.abs(youNet) < 0.5 ? fmtINR(0) : (youNet > 0 ? '+' : '−') + fmtINR(Math.abs(youNet))}
                </p>
                <p className="sub">
                  {Math.abs(youNet) < 0.5 ? 'Settled in this trip' : youNet > 0 ? 'You are owed in this trip' : 'You owe in this trip'}
                </p>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="net" style={{ color: 'var(--text)' }}>{fmtINR(total)}</p>
                <p className="sub">Total spent · {expenses.length} expense{expenses.length === 1 ? '' : 's'}</p>
              </React.Fragment>
            )}
            <div className="summary-split">
              <div>
                <div className="col-label">Expenses</div>
                <div className="col-amt" style={{ color: 'var(--text)' }}>{expenses.length}</div>
              </div>
              <div>
                <div className="col-label">People</div>
                <div className="col-amt" style={{ color: 'var(--text)' }}>{balances.length || members.length}</div>
              </div>
              <div>
                <div className="col-label">Spent</div>
                <div className="col-amt" style={{ color: 'var(--text)' }}>{fmtINR(total)}</div>
              </div>
            </div>
          </div>

          <div className="tabs">
            <button className={`tab ${tab === 'expenses' ? 'active' : ''}`} onClick={() => setTab('expenses')}>Expenses</button>
            <button className={`tab ${tab === 'balances' ? 'active' : ''}`} onClick={() => setTab('balances')}>Balances</button>
            <button className={`tab ${tab === 'settle' ? 'active' : ''}`}   onClick={() => setTab('settle')}>Settle</button>
          </div>

          {tab === 'expenses' && <ExpensesTab expenses={expenses} self={self} onEdit={onEditExpense} onReact={onReact} />}
          {tab === 'balances' && <BalancesTab balances={balances} self={self} expenses={expenses} />}
          {tab === 'settle'   && <SettleTab settlements={settlements} balances={balances} self={self} onPay={(s) => onPay(s, trip)} />}

          <div className="spacer-fab" />

          {expenses.length >= 2 && <TripRecap trip={trip} group={group} expenses={expenses} balances={balances} />}

          {tab === 'expenses' && members.length > 0 && (
            <button className="fab" onClick={onAddExpense} aria-label="Add expense"><Icon.Plus /></button>
          )}

          {celebrating && <Celebration message={`"${trip.name}" is fully settled!`} />}
        </React.Fragment>
      );
    }

    function TripRecap({ trip, group, expenses, balances }) {
      const stats = useMemo(() => {
        const total = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
        // Date range
        const dates = expenses.map((e) => e.expense_date).filter(Boolean).sort();
        const firstDate = dates[0];
        const lastDate = dates[dates.length - 1];
        const dayCount = (firstDate && lastDate)
          ? Math.max(1, Math.round((new Date(lastDate) - new Date(firstDate)) / 86400000) + 1)
          : 1;

        // By date for "busiest day"
        const byDate = new Map();
        for (const e of expenses) {
          const k = e.expense_date;
          byDate.set(k, (byDate.get(k) || 0) + Number(e.amount || 0));
        }
        let busiestDay = null;
        let busiestDayAmt = 0;
        for (const [k, v] of byDate) if (v > busiestDayAmt) { busiestDayAmt = v; busiestDay = k; }

        // By category
        const byCat = new Map();
        for (const e of expenses) byCat.set(e.category || 'other', (byCat.get(e.category || 'other') || 0) + Number(e.amount || 0));
        let topCat = 'other'; let topCatAmt = 0;
        for (const [k, v] of byCat) if (v > topCatAmt) { topCatAmt = v; topCat = k; }
        const topCatPct = total > 0 ? Math.round((topCatAmt / total) * 100) : 0;
        const topCatInfo = CAT_BY_ID[topCat] || CAT_BY_ID.other;

        // Biggest single expense
        const biggest = expenses.reduce((m, e) => (Number(e.amount || 0) > Number(m?.amount || 0) ? e : m), null);

        // Biggest spender
        const paid = new Map();
        for (const e of expenses) paid.set(e.paid_by, (paid.get(e.paid_by) || 0) + Number(e.amount || 0));
        let topSpender = null; let topSpenderAmt = 0;
        for (const [n, v] of paid) if (v > topSpenderAmt) { topSpenderAmt = v; topSpender = n; }

        const memberCount = balances.length || paid.size;
        const avgPerPerson = memberCount > 0 ? total / memberCount : 0;

        return { total, dayCount, busiestDay, busiestDayAmt, topCat: topCatInfo, topCatPct, topCatAmt, biggest, topSpender, topSpenderAmt, memberCount, avgPerPerson };
      }, [expenses, balances]);

      const copyRecap = () => {
        const lines = [
          `${trip.emoji} ${trip.name} — trip recap`,
          `${fmtINR(stats.total)} across ${expenses.length} expenses · ${stats.dayCount} day${stats.dayCount === 1 ? '' : 's'}`,
          stats.topSpender ? `Top spender: ${stats.topSpender} (${fmtINR(stats.topSpenderAmt)})` : null,
          stats.busiestDay ? `Biggest day: ${fmtDate(stats.busiestDay)} (${fmtINR(stats.busiestDayAmt)})` : null,
          `Top category: ${stats.topCat.emoji} ${stats.topCat.label} (${stats.topCatPct}%)`,
          `Avg per person: ${fmtINR(stats.avgPerPerson)}`,
        ].filter(Boolean);
        const text = lines.join('\n');
        try {
          navigator.clipboard.writeText(text);
        } catch {
          // ignore
        }
      };

      return (
        <React.Fragment>
          <p className="section-title">Trip recap</p>
          <div className="summary" style={{
            background: `radial-gradient(120% 100% at 0% 0%, ${group.color}24 0%, transparent 60%), radial-gradient(100% 80% at 100% 100%, ${group.color}18 0%, transparent 60%), linear-gradient(140deg, #15151E 0%, #1C1C2C 100%)`,
            borderColor: `${group.color}40`,
            padding: 20,
          }}>
            <div className="grain" />
            <div style={{ position: 'relative' }}>
              <p className="label" style={{ color: group.color }}>Recap · {stats.dayCount} day{stats.dayCount === 1 ? '' : 's'}</p>
              <p className="net" style={{ color: 'var(--text)' }}>{fmtINR(stats.total)}</p>
              <p className="sub">across {expenses.length} expense{expenses.length === 1 ? '' : 's'} · avg {fmtINR(stats.avgPerPerson)}/person</p>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 18 }}>
                {stats.topSpender && (
                  <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 12, padding: 12 }}>
                    <div style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 10, color: 'var(--text-mute)', textTransform: 'uppercase', letterSpacing: '.08em' }}>Top spender</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
                      <Avatar name={stats.topSpender} size="sm" />
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 14, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{stats.topSpender}</div>
                        <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 13, color: 'var(--primary)' }}>{fmtINR(stats.topSpenderAmt)}</div>
                      </div>
                    </div>
                  </div>
                )}
                <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 12, padding: 12 }}>
                  <div style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 10, color: 'var(--text-mute)', textTransform: 'uppercase', letterSpacing: '.08em' }}>Top category</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 8 }}>
                    <span style={{ fontSize: 24 }}>{stats.topCat.emoji}</span>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 14, color: 'var(--text)' }}>{stats.topCat.label}</div>
                      <div style={{ fontFamily: 'Inter', fontWeight: 500, fontSize: 12, color: 'var(--text-soft)' }}>{stats.topCatPct}% of spend</div>
                    </div>
                  </div>
                </div>
                {stats.busiestDay && (
                  <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 12, padding: 12 }}>
                    <div style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 10, color: 'var(--text-mute)', textTransform: 'uppercase', letterSpacing: '.08em' }}>Biggest day</div>
                    <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 14, color: 'var(--text)', marginTop: 8 }}>{fmtDate(stats.busiestDay)}</div>
                    <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 13, color: 'var(--primary)' }}>{fmtINR(stats.busiestDayAmt)}</div>
                  </div>
                )}
                {stats.biggest && (
                  <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 12, padding: 12 }}>
                    <div style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 10, color: 'var(--text-mute)', textTransform: 'uppercase', letterSpacing: '.08em' }}>Biggest expense</div>
                    <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 14, color: 'var(--text)', marginTop: 8, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{stats.biggest.description}</div>
                    <div style={{ fontFamily: 'Manrope', fontWeight: 700, fontSize: 13, color: 'var(--primary)' }}>{fmtINR(stats.biggest.amount)}</div>
                  </div>
                )}
              </div>

              <button
                className="btn btn-soft btn-full"
                onClick={copyRecap}
                style={{ marginTop: 16 }}
              >Copy recap to share</button>
            </div>
          </div>
        </React.Fragment>
      );
    }

    const REACTION_EMOJIS = ['🎉', '👍', '💸', '🔥', '😂', '❤️'];

    // Lightweight reaction bar shown under each expense row.
    function ReactionBar({ expense, self, onReact }) {
      const [picking, setPicking] = useState(false);
      const reactions = (expense.reactions && typeof expense.reactions === 'object') ? expense.reactions : {};
      // Group by emoji → list of names
      const grouped = {};
      for (const [name, emoji] of Object.entries(reactions)) {
        if (!emoji) continue;
        if (!grouped[emoji]) grouped[emoji] = [];
        grouped[emoji].push(name);
      }
      const emojiOrder = REACTION_EMOJIS.filter((e) => grouped[e]);
      const myReaction = self ? reactions[self] : null;

      const stop = (e) => { e.stopPropagation(); };

      const handleReact = (emoji, e) => {
        e.stopPropagation();
        setPicking(false);
        // If user already had this emoji → remove. Otherwise set/replace.
        const next = { ...reactions };
        if (myReaction === emoji) delete next[self];
        else if (self) next[self] = emoji;
        onReact(expense.id, next);
      };

      if (emojiOrder.length === 0 && !self) return null;

      return (
        <div onClick={stop} style={{
          display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap',
          marginTop: 8, paddingTop: 8,
          borderTop: '1px dashed var(--border)',
        }}>
          {emojiOrder.map((emoji) => {
            const names = grouped[emoji];
            const youReacted = self && names.includes(self);
            return (
              <button
                key={emoji}
                onClick={(e) => handleReact(emoji, e)}
                title={names.join(', ')}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 4,
                  padding: '3px 8px', borderRadius: 999,
                  background: youReacted ? 'rgba(0,229,160,.15)' : 'var(--surface-2)',
                  border: '1px solid ' + (youReacted ? 'rgba(0,229,160,.4)' : 'var(--border)'),
                  fontFamily: 'Inter', fontWeight: 600, fontSize: 12,
                  color: youReacted ? 'var(--primary)' : 'var(--text-soft)',
                  cursor: 'pointer',
                }}
              >
                <span>{emoji}</span>
                <span>{names.length}</span>
              </button>
            );
          })}
          {self && (
            <div style={{ position: 'relative', display: 'inline-flex' }}>
              <button
                onClick={(e) => { e.stopPropagation(); setPicking((v) => !v); }}
                aria-label="React"
                style={{
                  width: 26, height: 26, borderRadius: 999,
                  background: 'var(--surface-2)',
                  border: '1px solid var(--border)',
                  color: 'var(--text-mute)',
                  fontFamily: 'Inter', fontWeight: 700, fontSize: 13,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  cursor: 'pointer',
                }}
              >{picking ? '×' : '+'}</button>
              {picking && (
                <div style={{
                  position: 'absolute', bottom: 'calc(100% + 6px)', right: 0,
                  display: 'flex', gap: 4,
                  padding: 6,
                  background: 'var(--surface-3)',
                  border: '1px solid var(--border-2)',
                  borderRadius: 999,
                  boxShadow: '0 12px 32px rgba(0,0,0,.5)',
                  zIndex: 5,
                }}>
                  {REACTION_EMOJIS.map((emoji) => (
                    <button
                      key={emoji}
                      onClick={(e) => handleReact(emoji, e)}
                      style={{
                        width: 32, height: 32, borderRadius: 999,
                        fontSize: 18,
                        background: myReaction === emoji ? 'rgba(0,229,160,.2)' : 'transparent',
                        border: 'none', cursor: 'pointer',
                        transition: 'background .12s ease, transform .12s ease',
                      }}
                      onMouseEnter={(e) => { e.currentTarget.style.transform = 'scale(1.2)'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
                    >{emoji}</button>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function ExpensesTab({ expenses, self, onEdit, onReact }) {
      const byDate = useMemo(() => {
        const g = new Map();
        for (const e of expenses) {
          if (!g.has(e.expense_date)) g.set(e.expense_date, []);
          g.get(e.expense_date).push(e);
        }
        return [...g.entries()].sort((a, b) => a[0] < b[0] ? 1 : -1);
      }, [expenses]);

      if (expenses.length === 0) {
        return (
          <div className="empty">
            <div className="emoji-bubble">💸</div>
            <h3>No expenses yet</h3>
            <p>Tap the + button to log your first split.</p>
          </div>
        );
      }

      return (
        <React.Fragment>
          {byDate.map(([date, items]) => (
            <React.Fragment key={date}>
              <p className="section-title">{fmtDate(date)}</p>
              <div>
                {items.map((e) => {
                  const cat = CAT_BY_ID[e.category] || CAT_BY_ID.other;
                  const splitters = Array.isArray(e.split_among) ? e.split_among : [];
                  const yl = youLine(e, self);
                  return (
                    <div key={e.id} className="exp-row" onClick={() => onEdit(e)} style={{ flexDirection: 'column', alignItems: 'stretch', gap: 0 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 14, width: '100%' }}>
                        <span className="exp-cat">{cat.emoji}</span>
                        <div className="exp-main">
                          <p className="exp-desc">{e.description}</p>
                          <p className="exp-payer">
                            {e.paid_by === self ? 'You' : e.paid_by} paid {fmtINR(e.amount)} · {splitters.length} split{e.shares && Object.keys(e.shares).length > 0 ? ' · unequal' : ''}
                          </p>
                        </div>
                        {e.image_url && (
                          <img
                            src={e.image_url}
                            alt=""
                            style={{ width: 44, height: 44, borderRadius: 10, objectFit: 'cover', flexShrink: 0, border: '1px solid var(--border)' }}
                          />
                        )}
                        <div className="exp-side">
                          {yl != null ? (
                            Math.abs(yl) < 0.5 ? (
                              <React.Fragment>
                                <div className="you-line zero">—</div>
                                <div className="you-label">no impact</div>
                              </React.Fragment>
                            ) : (
                              <React.Fragment>
                                <div className={`you-line ${yl > 0 ? 'pos' : 'neg'}`}>
                                  {(yl > 0 ? '+' : '−') + fmtINR(Math.abs(yl))}
                                </div>
                                <div className="you-label">{yl > 0 ? 'you lent' : 'you owe'}</div>
                              </React.Fragment>
                            )
                          ) : (
                            <React.Fragment>
                              <div className="total">total</div>
                              <div className="total-amt">{fmtINR(e.amount)}</div>
                            </React.Fragment>
                          )}
                        </div>
                      </div>
                      <ReactionBar expense={e} self={self} onReact={onReact} />
                    </div>
                  );
                })}
              </div>
            </React.Fragment>
          ))}
        </React.Fragment>
      );
    }

    function BalancesTab({ balances, self, expenses }) {
      // Compute per-person "paid" and "share" totals. Net = paid - share matches calcBalances.
      const breakdown = useMemo(() => {
        const paid = new Map();
        const share = new Map();
        const ensure = (m, n) => { if (!m.has(n)) m.set(n, 0); };
        for (const e of (expenses || [])) {
          const amt = Number(e.amount) || 0;
          const shares = expenseShares(e);
          if (Object.keys(shares).length === 0) continue;
          ensure(paid, e.paid_by);
          paid.set(e.paid_by, paid.get(e.paid_by) + amt);
          for (const [name, s] of Object.entries(shares)) {
            ensure(share, name);
            share.set(name, share.get(name) + s);
          }
        }
        const names = new Set([...paid.keys(), ...share.keys()]);
        const rows = [...names].map((name) => ({
          name,
          paid: paid.get(name) || 0,
          share: share.get(name) || 0,
          net: (paid.get(name) || 0) - (share.get(name) || 0),
        })).sort((a, b) => b.paid - a.paid);
        const maxPaid = rows.reduce((m, r) => Math.max(m, r.paid), 0);
        const totalPaid = rows.reduce((s, r) => s + r.paid, 0);
        return { rows, maxPaid, totalPaid };
      }, [expenses]);

      if (balances.length === 0) {
        return (
          <div className="empty">
            <div className="emoji-bubble">⚖️</div>
            <h3>Nothing to balance yet</h3>
            <p>Add expenses to see who owes whom.</p>
          </div>
        );
      }

      const selfRow = self ? breakdown.rows.find((r) => r.name === self) : null;
      const selfPct = selfRow && breakdown.totalPaid > 0
        ? Math.round((selfRow.paid / breakdown.totalPaid) * 100)
        : null;

      return (
        <React.Fragment>
          {selfRow && (
            <div className="summary" style={{ padding: 18, marginTop: 8 }}>
              <p className="label">You paid</p>
              <p className="net" style={{ color: 'var(--primary)' }}>{fmtINR(selfRow.paid)}</p>
              <p className="sub">
                {selfPct != null ? `${selfPct}% of the trip's ${fmtINR(breakdown.totalPaid)} total` : ' '}
                {' · share '}{fmtINR(selfRow.share)}
              </p>
            </div>
          )}

          <p className="section-title">Who paid what</p>
          <div style={{
            background: 'var(--surface)',
            border: '1px solid var(--border)',
            borderRadius: 'var(--r-3)',
            padding: 12,
          }}>
            {breakdown.rows.map((r) => {
              const widthPct = breakdown.maxPaid > 0 ? Math.max(2, (r.paid / breakdown.maxPaid) * 100) : 0;
              const isSelf = r.name === self;
              return (
                <div key={r.name} style={{ padding: '10px 4px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                    <Avatar name={r.name} size="sm" />
                    <span style={{ fontFamily: 'Manrope', fontWeight: 600, fontSize: 14, flex: 1, color: 'var(--text)' }}>
                      {isSelf ? `${r.name} (you)` : r.name}
                    </span>
                    <span className="amt amt-sm" style={{ color: r.paid > 0 ? 'var(--text)' : 'var(--text-mute)' }}>
                      {fmtINR(r.paid)}
                    </span>
                  </div>
                  <div style={{
                    height: 6, borderRadius: 999,
                    background: 'rgba(255,255,255,.05)',
                    overflow: 'hidden',
                  }}>
                    <div style={{
                      height: '100%', width: widthPct + '%',
                      background: r.paid > 0
                        ? (isSelf
                          ? 'linear-gradient(90deg, var(--primary) 0%, #1BFFB8 100%)'
                          : 'linear-gradient(90deg, rgba(0,229,160,.5) 0%, rgba(0,229,160,.8) 100%)')
                        : 'transparent',
                      borderRadius: 999,
                      transition: 'width .35s cubic-bezier(.2,.8,.25,1)',
                    }} />
                  </div>
                  <div style={{
                    display: 'flex', justifyContent: 'space-between',
                    marginTop: 6,
                    fontFamily: 'Inter', fontWeight: 500, fontSize: 11,
                    color: 'var(--text-mute)',
                  }}>
                    <span>Share {fmtINR(r.share)}</span>
                    <span style={{ color: Math.abs(r.net) < 0.5 ? 'var(--text-mute)' : r.net > 0 ? 'var(--primary)' : 'var(--negative)' }}>
                      Net {Math.abs(r.net) < 0.5 ? fmtINR(0) : (r.net > 0 ? '+' : '−') + fmtINR(Math.abs(r.net))}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>

          <p className="section-title">Net positions</p>
          <div>
            {balances.map((b) => {
              const owes = b.net < -0.5;
              const gets = b.net > 0.5;
              const settled = !owes && !gets;
              const isSelf = b.name === self;
              return (
                <div key={b.name} className="balance-row">
                  <Avatar name={b.name} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="name">{isSelf ? `${b.name} (you)` : b.name}</div>
                    <div className="status">
                      {settled ? 'settled up' : gets ? (isSelf ? 'you get back' : 'gets back') : (isSelf ? 'you owe' : 'owes')}
                    </div>
                  </div>
                  <div className={`amt amt-md ${gets ? 'pos' : owes ? 'neg' : 'zero'}`}>
                    {settled ? fmtINR(0) : (gets ? '+' : '−') + fmtINR(Math.abs(b.net))}
                  </div>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      );
    }

    function SettleRow({ s, self, onPay }) {
      const isYours = self && (s.from === self || s.to === self);
      const youArePayer = self && s.from === self;
      return (
        <div className="settle-row">
          <Avatar name={s.from} size="sm" />
          <span className="who">{s.from === self ? 'You' : s.from}</span>
          <Icon.Arrow className="arrow" />
          <Avatar name={s.to} size="sm" />
          <span className="who">{s.to === self ? 'you' : s.to}</span>
          <span className="pay-amt">{fmtINR(s.amount)}</span>
          {youArePayer && (
            <button
              onClick={() => onPay(s)}
              style={{
                fontFamily: 'Manrope', fontWeight: 700, fontSize: 12,
                color: '#0A1A14', background: 'var(--primary)',
                padding: '6px 14px', borderRadius: 999,
                boxShadow: '0 0 0 1px rgba(0,229,160,.4), 0 4px 12px rgba(0,229,160,.3)',
                marginLeft: 8,
              }}
            >Pay</button>
          )}
        </div>
      );
    }

    function SettleTab({ settlements, balances, self, onPay }) {
      if (balances.length === 0) {
        return (
          <div className="empty">
            <div className="emoji-bubble">🎯</div>
            <h3>Nothing to settle</h3>
            <p>Add expenses to generate settle-up suggestions.</p>
          </div>
        );
      }
      if (settlements.length === 0) {
        return (
          <div className="empty">
            <div className="emoji-bubble">🎉</div>
            <h3>All settled!</h3>
            <p>No transfers needed — everyone's even.</p>
          </div>
        );
      }
      const yours = self ? settlements.filter((s) => s.from === self || s.to === self) : [];
      const others = self ? settlements.filter((s) => s.from !== self && s.to !== self) : settlements;
      return (
        <React.Fragment>
          {yours.length > 0 && (
            <React.Fragment>
              <p className="section-title">Your transfers</p>
              <div>
                {yours.map((s, i) => <SettleRow key={'y' + i} s={s} self={self} onPay={onPay} />)}
              </div>
            </React.Fragment>
          )}
          {others.length > 0 && (
            <React.Fragment>
              <p className="section-title">{yours.length > 0 ? 'Between others' : `${settlements.length} transfer${settlements.length === 1 ? '' : 's'}`}</p>
              <div>
                {others.map((s, i) => <SettleRow key={'o' + i} s={s} self={self} onPay={onPay} />)}
              </div>
            </React.Fragment>
          )}
        </React.Fragment>
      );
    }

    // ---------- Sheets ----------
    function AddGroupSheet({ open, onClose, onCreate }) {
      const [name, setName] = useState('');
      const [emoji, setEmoji] = useState(GROUP_EMOJIS[0]);
      const [color, setColor] = useState(COLORS[0]);
      useEffect(() => { if (open) { setName(''); setEmoji(GROUP_EMOJIS[0]); setColor(COLORS[0]); } }, [open]);
      const submit = () => { if (!name.trim()) return; onCreate({ name: name.trim(), emoji, color }); };
      return (
        <Sheet open={open} onClose={onClose} title="New group" onSave={submit} saveLabel="Create" canSave={!!name.trim()}>
          <div className="field">
            <label className="field-label">Group name</label>
            <input autoFocus placeholder="Goa Squad" value={name} onChange={(e) => setName(e.target.value)} maxLength={40} />
          </div>
          <div className="field">
            <label className="field-label">Accent color</label>
            <ColorPicker value={color} onChange={setColor} />
          </div>

            <EmojiPicker pool={GROUP_EMOJIS} value={emoji} onChange={setEmoji} />
          </div>
        </Sheet>

    function AddMemberSheet({ open, onClose, onCreate, existingNames }) {

      const submit = () => { if (canSave) onCreate(trimmed); };

          <div className="field">

            <input autoFocus placeholder="Goa Dec 2024" value={name} onChange={(e) => setName(e.target.value)} maxLength={50} />
          </div>
          <div className="field">

          </div>

    function SelfPickerSheet({ open, onClose, members, current, onPick }) {
      return (
        <Sheet open={open} onClose={onClose} title="Who are you?">
          <p style={{ color: 'var(--text-soft)', fontSize: 13, marginTop: 0 }}>
            Pick yourself from the group's members. The app uses this to show personalized "you owe" / "you're owed" amounts.
          </p>
          <div className="spacer-1" />
          <div>
            {members.map((m) => (

                  <p className="exp-desc">{m.name}</p>
                  {m.name === current && <p className="exp-payer" style={{ color: 'var(--primary)' }}>Currently selected</p>}
                </div>

              </div>

              </React.Fragment>

    function AddExpenseSheet({ open, onClose, onCreate, onUpdate, onDelete, members, self, editing }) {
      const isEdit = !!editing;
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState('');
      const [date, setDate] = useState(todayISO());
      const [category, setCategory] = useState('food');
      const [paidBy, setPaidBy] = useState(self || members[0]?.name || '');
      const [splitAmong, setSplitAmong] = useState(members.map((m) => m.name));
      const [splitMode, setSplitMode] = useState('equal'); // 'equal' | 'percentage' | 'exact'
      const [shareInputs, setShareInputs] = useState({}); // { name: stringValue }
      const [imageUrl, setImageUrl] = useState(null);
      const [photoBusy, setPhotoBusy] = useState(false);
      const fileInputRef = React.useRef(null);

      // Reset state only when the sheet opens (false→true) OR when switching
      // between editing different expenses. Crucially we do NOT depend on
      // `members` or `self` — those references change on every Supabase poll
      // and would wipe what the user is currently typing.
      const editingId = editing?.id;
      useEffect(() => {
        if (!open) return;
        if (editing) {
          setDescription(editing.description || '');
          setAmount(String(editing.amount ?? ''));
          setDate(editing.expense_date || todayISO());
          setCategory(editing.category || 'food');
          setPaidBy(editing.paid_by || (self || members[0]?.name || ''));
          setSplitAmong(Array.isArray(editing.split_among) ? [...editing.split_among] : members.map((m) => m.name));
          setImageUrl(editing.image_url || null);
          if (editing.shares && Object.keys(editing.shares).length > 0) {
            setSplitMode('exact');
            const inputs = {};
            for (const [k, v] of Object.entries(editing.shares)) inputs[k] = String(v);
            setShareInputs(inputs);
          } else {
            setSplitMode('equal');
            setShareInputs({});
          }
        } else {
          setDescription(''); setAmount(''); setDate(todayISO()); setCategory('food');
          setPaidBy(self || members[0]?.name || ''); setSplitAmong(members.map((m) => m.name));
          setSplitMode('equal'); setShareInputs({});
          setImageUrl(null);
        }
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [open, editingId]);

      const amt = Number(amount);

      // ---- Split-mode helpers ----
      const switchMode = (next) => {
        if (next === splitMode) return;
        if (next === 'equal') {
          // keep splitAmong as-is (or rebuild from shareInputs keys if needed)
          if (splitMode !== 'equal' && Object.keys(shareInputs).length > 0) {
            setSplitAmong(Object.keys(shareInputs));
          }
        } else {
          // Switching to % or exact — seed inputs from current splitAmong members
          const seeded = {};
          const targets = splitAmong.length ? splitAmong : members.map((m) => m.name);
          if (next === 'percentage' && targets.length > 0) {
            const each = (100 / targets.length).toFixed(2);
            for (const n of targets) seeded[n] = each;
          } else if (next === 'exact' && targets.length > 0 && amt > 0) {
            const each = (amt / targets.length).toFixed(2);
            for (const n of targets) seeded[n] = each;
          } else {
            for (const n of targets) seeded[n] = '';
          }
          setShareInputs(seeded);
        }
        setSplitMode(next);
      };

      const toggleSplit = (name) => setSplitAmong((p) => p.includes(name) ? p.filter((n) => n !== name) : [...p, name]);

      const toggleShareMember = (name) => {
        setShareInputs((prev) => {
          const next = { ...prev };
          if (name in next) delete next[name];
          else next[name] = '';
          return next;
        });
      };
      const setShareValue = (name, value) => {
        setShareInputs((prev) => ({ ...prev, [name]: value }));
      };

      // ---- Compute final shares + validation ----
      const computed = useMemo(() => {
        if (splitMode === 'equal') {
          return { shares: null, splitAmong, sum: amt, error: null };
        }
        const sharesNum = {};
        for (const [k, v] of Object.entries(shareInputs)) {
          const n = Number(v);
          if (!isNaN(n) && n > 0) sharesNum[k] = n;
        }
        if (splitMode === 'percentage') {
          const totalPct = Object.values(sharesNum).reduce((s, n) => s + n, 0);
          if (Math.abs(totalPct - 100) > 0.5) {
            return { shares: null, splitAmong: Object.keys(sharesNum), sum: totalPct, error: `Percentages total ${totalPct.toFixed(2)}%, must total 100%` };
          }
          const rupeeShares = {};
          for (const [k, pct] of Object.entries(sharesNum)) rupeeShares[k] = +(amt * pct / 100).toFixed(2);
          return { shares: rupeeShares, splitAmong: Object.keys(rupeeShares), sum: totalPct, error: null };
        }
        // exact
        const totalRs = Object.values(sharesNum).reduce((s, n) => s + n, 0);
        if (Math.abs(totalRs - amt) > 0.5) {
          return { shares: null, splitAmong: Object.keys(sharesNum), sum: totalRs, error: `Amounts total ${fmtINR(totalRs, true)}, must equal ${fmtINR(amt, true)}` };
        }
        return { shares: sharesNum, splitAmong: Object.keys(sharesNum), sum: totalRs, error: null };
      }, [splitMode, splitAmong, shareInputs, amt]);

      const splittersCount = splitMode === 'equal' ? splitAmong.length : Object.keys(shareInputs).length;
      const isValid =
        description.trim().length > 0 &&
        !isNaN(amt) && amt > 0 &&
        !!paidBy &&
        splittersCount > 0 &&
        !!date &&
        !computed.error;

      const perPerson = (splitMode === 'equal' && isValid) ? amt / splitAmong.length : 0;

      const submit = () => {
        if (!isValid) return;
        const payload = {
          description: description.trim(), amount: amt, paid_by: paidBy,
          split_among: computed.splitAmong, category, expense_date: date,
          shares: computed.shares,
          image_url: imageUrl,
        };
        if (isEdit) onUpdate(editing.id, payload);
        else onCreate(payload);
      };

      const onPickFile = async (file) => {
        if (!file) return;
        setPhotoBusy(true);
        try {
          const dataUrl = await compressImage(file);
          setImageUrl(dataUrl);
        } catch (e) {
          alert('Could not load image: ' + (e?.message || e));
        } finally {
          setPhotoBusy(false);
        }
      };

      return (
        <Sheet open={open} onClose={onClose} title={isEdit ? 'Edit expense' : 'New expense'} onSave={submit} saveLabel={isEdit ? 'Save' : 'Add'} canSave={isValid}>
          <div className="field">
            <label className="field-label">Photo (optional)</label>
            <input
              ref={fileInputRef}
              type="file"
              accept="image/*"
              capture="environment"
              style={{ display: 'none' }}
              onChange={(e) => {
                const f = e.target.files && e.target.files[0];
                onPickFile(f);
                e.target.value = '';
              }}
            />
            {imageUrl ? (
              <div style={{
                position: 'relative',
                borderRadius: 'var(--r-2)',
                overflow: 'hidden',
                border: '1px solid var(--border)',
                background: 'var(--surface)',
              }}>
                <img src={imageUrl} alt="" style={{ width: '100%', maxHeight: 240, objectFit: 'cover', display: 'block' }} />
                <button
                  type="button"
                  onClick={() => setImageUrl(null)}
                  aria-label="Remove photo"
                  style={{
                    position: 'absolute', top: 8, right: 8,
                    width: 32, height: 32, borderRadius: 999,
                    background: 'rgba(0,0,0,.6)',
                    border: '1px solid rgba(255,255,255,.15)',
                    color: 'white',
                    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer',
                  }}
                ><Icon.X /></button>
              </div>
            ) : (
              <button
                type="button"
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                disabled={photoBusy}
                style={{
                  width: '100%',
                  padding: '20px 14px',
                  borderRadius: 'var(--r-2)',
                  border: '1px dashed var(--border-2)',
                  background: 'var(--surface)',
                  color: 'var(--text-soft)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
                  fontFamily: 'Inter', fontWeight: 500, fontSize: 14,
                  cursor: 'pointer',
                  opacity: photoBusy ? .5 : 1,
                }}
              >
                <Icon.Camera />
                {photoBusy ? 'Compressing…' : 'Attach receipt or food photo'}
              </button>
            )}
          </div>
          <div className="field">
            <label className="field-label">Description</label>
            <input autoFocus placeholder="Dinner at Britto's" value={description} onChange={(e) => setDescription(e.target.value)} maxLength={60} />
          </div>
          <div className="field">
            <label className="field-label">Amount</label>
            <div className="amount-input-wrap">
              <input type="number" inputMode="decimal" min="0" step="0.01" placeholder="0" className="amount-input"
                value={amount} onChange={(e) => setAmount(e.target.value)} />
            </div>
            {amt > 0 && splitAmong.length > 0 && (
              <p className="split-hint">{fmtINR(perPerson, true)} per person × {splitAmong.length}</p>
            )}
          </div>
          <div className="field">
            <label className="field-label">Date</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} max={todayISO()} />
          </div>
          <div className="field">
            <label className="field-label">Category</label>
            <div className="chips">
              {CATEGORIES.map((c) => (
                <button key={c.id} type="button"
                  className={`chip selectable ${category === c.id ? 'active soft' : ''}`}
                  onClick={() => setCategory(c.id)}>
                  <span>{c.emoji}</span>{c.label}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label className="field-label">Paid by</label>
            <div className="chips">
              {members.map((m) => (
                <button key={m.id} type="button"
                  className={`chip-member ${paidBy === m.name ? 'selected-pay' : ''}`}
                  onClick={() => setPaidBy(m.name)}>
                  <Avatar name={m.name} size="sm" />
                  {m.name === self ? `${m.name} (you)` : m.name}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label className="field-label">Split mode</label>
            <div className="chips">
              <button type="button" className={`chip selectable ${splitMode === 'equal' ? 'active soft' : ''}`} onClick={() => switchMode('equal')}>Equal</button>
              <button type="button" className={`chip selectable ${splitMode === 'percentage' ? 'active soft' : ''}`} onClick={() => switchMode('percentage')}>By %</button>
              <button type="button" className={`chip selectable ${splitMode === 'exact' ? 'active soft' : ''}`} onClick={() => switchMode('exact')}>Exact ₹</button>
            </div>
          </div>

          {splitMode === 'equal' ? (
            <div className="field">
              <label className="field-label">Split among ({splitAmong.length})</label>
              <div className="chips">
                {members.map((m) => (
                  <button key={m.id} type="button"
                    className={`chip-member ${splitAmong.includes(m.name) ? 'active' : ''}`}
                    onClick={() => toggleSplit(m.name)}>
                    <Avatar name={m.name} size="sm" />
                    {m.name === self ? `${m.name} (you)` : m.name}
                  </button>
                ))}
              </div>
              <p className="split-hint">Equal split between {splitAmong.length || 0} {splitAmong.length === 1 ? 'person' : 'people'}.</p>
            </div>
          ) : (
            <div className="field">
              <label className="field-label">
                {splitMode === 'percentage' ? 'Set percentage per person' : 'Set exact ₹ per person'}
              </label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {members.map((m) => {
                  const included = m.name in shareInputs;
                  return (
                    <div
                      key={m.id}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 10,
                        padding: '10px 12px',
                        background: 'var(--surface)',
                        border: '1px solid ' + (included ? 'rgba(0,229,160,.35)' : 'var(--border)'),
                        borderRadius: 'var(--r-2)',
                        opacity: included ? 1 : .55,
                      }}
                    >
                      <button
                        type="button"
                        onClick={() => toggleShareMember(m.name)}
                        style={{
                          width: 22, height: 22, borderRadius: 6,
                          border: '2px solid ' + (included ? 'var(--primary)' : 'var(--border-2)'),
                          background: included ? 'var(--primary)' : 'transparent',
                          color: '#0A1A14',
                          fontFamily: 'Manrope', fontWeight: 800, fontSize: 14,
                          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                          flexShrink: 0,
                        }}
                        aria-label={included ? `Exclude ${m.name}` : `Include ${m.name}`}
                      >{included ? '✓' : ''}</button>
                      <Avatar name={m.name} size="sm" />
                      <span style={{ fontFamily: 'Manrope', fontWeight: 600, fontSize: 14, flex: 1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {m.name === self ? `${m.name} (you)` : m.name}
                      </span>
                      <div style={{ position: 'relative', width: 100, flexShrink: 0 }}>
                        <input
                          type="number"
                          inputMode="decimal"
                          min="0"
                          step={splitMode === 'percentage' ? '0.01' : '1'}
                          placeholder="0"
                          value={shareInputs[m.name] ?? ''}
                          onChange={(e) => {
                            setShareValue(m.name, e.target.value);
                            // auto-include if user types
                            if (!(m.name in shareInputs) && e.target.value) toggleShareMember(m.name);
                          }}
                          disabled={!included}
                          style={{
                            padding: '8px 28px 8px 10px',
                            fontFamily: 'Manrope', fontWeight: 700, fontSize: 14,
                            textAlign: 'right',
                          }}
                        />
                        <span style={{
                          position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)',
                          color: 'var(--text-mute)', fontFamily: 'Manrope', fontWeight: 600, fontSize: 13,
                          pointerEvents: 'none',
                        }}>{splitMode === 'percentage' ? '%' : '₹'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              <p className="split-hint" style={{ color: computed.error ? 'var(--negative)' : 'var(--primary)' }}>
                {computed.error
                  ? computed.error
                  : splitMode === 'percentage'
                    ? `Totals 100% across ${Object.keys(shareInputs).length} ${Object.keys(shareInputs).length === 1 ? 'person' : 'people'}`
                    : `Totals ${fmtINR(amt, true)} across ${Object.keys(shareInputs).length} ${Object.keys(shareInputs).length === 1 ? 'person' : 'people'}`
                }
              </p>
            </div>
          )}
          {isEdit && onDelete && (
            <React.Fragment>
              <div className="spacer-3" />
              <button className="btn btn-danger btn-full" onClick={() => onDelete(editing)}>
                <Icon.Trash /> Delete this expense
              </button>
            </React.Fragment>
          )}
          <div className="spacer-2" />
        </Sheet>
      );
    }

    function CalculatorSheet({ open, onClose }) {
      const [display, setDisplay] = useState('0');
      const [prev, setPrev] = useState(null);   // previous operand (number) or null
      const [op, setOp] = useState(null);       // pending operator: +, -, ×, ÷
      const [justComputed, setJustComputed] = useState(false);

      useEffect(() => {
        if (open) {
          setDisplay('0'); setPrev(null); setOp(null); setJustComputed(false);
        }
      }, [open]);

      const compute = (a, b, operator) => {
        switch (operator) {
          case '+': return a + b;
          case '−': return a - b;
          case '×': return a * b;
          case '÷': return b === 0 ? null : a / b;
          default: return b;
        }
      };

      const pressDigit = (d) => {
        if (justComputed) {
          setDisplay(d);
          setJustComputed(false);
          return;
        }
        setDisplay((cur) => (cur === '0' ? d : cur + d));
      };
      const pressDot = () => {
        if (justComputed) { setDisplay('0.'); setJustComputed(false); return; }
        setDisplay((cur) => cur.includes('.') ? cur : cur + '.');
      };
      const pressOp = (next) => {
        const current = Number(display);
        if (prev != null && op && !justComputed) {
          const result = compute(prev, current, op);
          if (result == null) { setDisplay('Error'); setPrev(null); setOp(null); return; }
          setDisplay(formatNum(result));
          setPrev(result);
        } else {
          setPrev(current);
        }
        setOp(next);
        setJustComputed(true);
      };
      const pressEquals = () => {
        if (prev == null || op == null) return;
        const current = Number(display);
        const result = compute(prev, current, op);
        if (result == null) { setDisplay('Error'); setPrev(null); setOp(null); return; }
        setDisplay(formatNum(result));
        setPrev(null);
        setOp(null);
        setJustComputed(true);
      };
      const pressClear = () => { setDisplay('0'); setPrev(null); setOp(null); setJustComputed(false); };
      const pressBack = () => {
        if (justComputed || display === 'Error') { pressClear(); return; }
        setDisplay((cur) => cur.length <= 1 ? '0' : cur.slice(0, -1));
      };
      const pressSign = () => {
        if (display === '0' || display === 'Error') return;
        setDisplay((cur) => cur.startsWith('-') ? cur.slice(1) : '-' + cur);
      };

      const formatNum = (n) => {
        if (!isFinite(n)) return 'Error';
        // Trim trailing zeros, max 8 decimals
        const s = (Math.round(n * 1e8) / 1e8).toString();
        return s;
      };

      // Pretty INR-style preview under the raw number
      const previewINR = useMemo(() => {
        const n = Number(display);
        if (!isFinite(n) || display === 'Error') return '';
        return fmtINR(n, true);
      }, [display]);

      const btnStyle = (variant) => ({
        height: 56,
        borderRadius: 14,
        fontFamily: 'Manrope', fontWeight: 700, fontSize: 18,
        background: variant === 'op' ? 'rgba(0,229,160,.1)' :
                    variant === 'eq' ? 'var(--primary)' :
                    variant === 'fn' ? 'var(--surface-2)' :
                    'var(--surface)',
        color: variant === 'eq' ? '#0A1A14' :
               variant === 'op' ? 'var(--primary)' :
               'var(--text)',
        border: '1px solid ' + (variant === 'op' ? 'rgba(0,229,160,.25)' : 'var(--border)'),
        transition: 'transform .08s ease, background .15s ease',
      });

      const Btn = ({ children, onClick, variant }) => (
        <button
          type="button"
          onClick={onClick}
          style={btnStyle(variant)}
          onTouchStart={(e) => { e.currentTarget.style.transform = 'scale(.96)'; }}
          onTouchEnd={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
        >{children}</button>
      );

      return (
        <Sheet open={open} onClose={onClose} title="Calculator">
          <div style={{
            background: 'var(--surface)',
            border: '1px solid var(--border)',
            borderRadius: 'var(--r-3)',
            padding: '20px 18px',
            marginBottom: 16,
            textAlign: 'right',
          }}>
            <div style={{
              fontFamily: 'Inter', fontWeight: 500, fontSize: 12,
              color: 'var(--text-mute)', textTransform: 'uppercase', letterSpacing: '.08em',
              minHeight: 16,
            }}>
              {prev != null && op ? `${formatNum(prev)} ${op}` : ' '}
            </div>
            <div style={{
              fontFamily: 'Manrope', fontWeight: 800,
              fontSize: 42, letterSpacing: '-.03em',
              color: display === 'Error' ? 'var(--negative)' : 'var(--text)',
              wordBreak: 'break-all',
              lineHeight: 1.1,
            }}>{display}</div>
            {display !== 'Error' && Number(display) !== 0 && (
              <div style={{
                fontFamily: 'Inter', fontWeight: 500, fontSize: 12,
                color: 'var(--primary)', marginTop: 4,
              }}>{previewINR}</div>
            )}
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            <Btn variant="fn" onClick={pressClear}>AC</Btn>
            <Btn variant="fn" onClick={pressSign}>±</Btn>
            <Btn variant="fn" onClick={pressBack}>⌫</Btn>
            <Btn variant="op" onClick={() => pressOp('÷')}>÷</Btn>

            <Btn onClick={() => pressDigit('7')}>7</Btn>
            <Btn onClick={() => pressDigit('8')}>8</Btn>
            <Btn onClick={() => pressDigit('9')}>9</Btn>
            <Btn variant="op" onClick={() => pressOp('×')}>×</Btn>

            <Btn onClick={() => pressDigit('4')}>4</Btn>
            <Btn onClick={() => pressDigit('5')}>5</Btn>
            <Btn onClick={() => pressDigit('6')}>6</Btn>
