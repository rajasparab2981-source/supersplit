<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080C" />
  <title>SplitPro — Split bills in ₹</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg:         #08080C;
      --bg-soft:    #0F0F16;
      --surface:    #15151E;
      --surface-2:  #1C1C28;
      --surface-3:  #25253A;
      --border:     rgba(255,255,255,0.06);
      --border-2:   rgba(255,255,255,0.10);
      --border-3:   rgba(255,255,255,0.16);

      --text:       #FFFFFF;
      --text-soft:  #A0A0B0;
      --text-mute:  #6B6B7D;
      --text-faint: #45455A;

      --primary:    #00E5A0;        /* neon money green = "you're owed" */
      --primary-2:  #1BFFB8;
      --primary-deep:#00B080;
      --primary-soft:rgba(0,229,160,.12);

      --negative:   #FF4D6D;        /* coral red = "you owe" */
      --negative-soft: rgba(255,77,109,.12);

      --gold:       #FFC857;
      --purple:     #6E5BFF;
      --warning:    #FFA740;

      --s-1: 8px; --s-2: 16px; --s-3: 24px; --s-4: 32px; --s-5: 40px; --s-6: 56px;
      --r-1: 10px; --r-2: 14px; --r-3: 20px; --r-4: 28px;

      --shadow-glow: 0 0 0 1px rgba(0,229,160,.25), 0 8px 32px rgba(0,229,160,.18);
      --shadow-card: 0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);

      --app-max: 480px;
      --header-h: 64px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400; font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      overscroll-behavior-y: none;
      background-image:
        radial-gradient(1200px 600px at 50% -200px, rgba(0,229,160,.07), transparent 60%),
        radial-gradient(800px 500px at 90% 100%, rgba(110,91,255,.06), transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    button { background: transparent; border: 0; cursor: pointer; padding: 0; }
    a { color: inherit; text-decoration: none; }

    input, select, textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-1);
      padding: 14px 16px;
      width: 100%;
      outline: none;
      color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    input::placeholder, textarea::placeholder { color: var(--text-faint); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0,229,160,.12);
      background: var(--surface-2);
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.9); cursor: pointer; }

    /* ---------- App shell ---------- */
    .app {
      max-width: var(--app-max);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-bottom: var(--s-6);
    }

    .app-header {
      position: sticky; top: 0; z-index: 20;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--s-2);
      background: rgba(8,8,12,.85);
      backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease;
    }
    .app-header.scrolled { border-bottom-color: var(--border); }

    .app-header h1 {
      font-family: 'Manrope';
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -.03em;
      margin: 0;
      background: linear-gradient(135deg, #FFFFFF 0%, #C7C7E0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .app-header .crumb {
      font-family: 'Inter'; font-weight: 500; font-size: 11px;
      color: var(--text-mute); margin: 0; line-height: 1;
      text-transform: uppercase; letter-spacing: .08em;
    }

    .icon-btn {
      width: 44px; height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px;
      color: var(--text-soft);
      transition: background .15s ease, color .15s ease;
    }
    .icon-btn:hover { background: var(--surface); color: var(--text); }
    .icon-btn:active { background: var(--surface-2); }

    .app-content { padding: 0 var(--s-2) var(--s-4); }

    /* ---------- Section title ---------- */
    .section-title {
      font-family: 'Inter';
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-mute);
      margin: var(--s-3) 0 10px;
      padding: 0 var(--s-1);
    }
    .section-row {
      display: flex; justify-content: space-between; align-items: center;
      margin: var(--s-3) 0 10px;
      padding: 0 var(--s-1);
    }
    .section-row .section-title { margin: 0; padding: 0; }
    .section-row .add-btn {
      font-family: 'Inter'; font-weight: 700; font-size: 12px;
      color: var(--primary); padding: 6px 12px; border-radius: 999px;
      background: rgba(0,229,160,.08); border: 1px solid rgba(0,229,160,.25);
      transition: background .15s ease;
    }
    .section-row .add-btn:hover { background: rgba(0,229,160,.15); }

    /* ---------- Summary hero ---------- */
    .summary {
      position: relative;
      border-radius: var(--r-4);
      padding: var(--s-3) var(--s-3);
      margin: var(--s-2) 0;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 0% 0%, rgba(0,229,160,.16) 0%, transparent 60%),
        radial-gradient(100% 80% at 100% 100%, rgba(110,91,255,.16) 0%, transparent 60%),
        linear-gradient(140deg, #15151E 0%, #1C1C2C 100%);
      border: 1px solid var(--border-2);
    }
    .summary .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: .04;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255,255,255,1) 1px, transparent 0);
      background-size: 4px 4px;
    }
    .summary .net {
      font-family: 'Manrope'; font-weight: 800;
      font-size: 42px; letter-spacing: -.04em; line-height: 1;
      margin: 6px 0 4px;
      position: relative;
    }
    .summary .net.pos { color: var(--primary); text-shadow: 0 0 24px rgba(0,229,160,.25); }
    .summary .net.neg { color: var(--negative); }
    .summary .net.zero { color: var(--text-soft); }

    .summary .label {
      font-family: 'Inter'; font-weight: 600; font-size: 11px;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--text-soft); margin: 0;
      position: relative;
    }
    .summary .sub {
      font-family: 'Inter'; font-weight: 500; font-size: 13px;
      color: var(--text-soft); margin: 0;
      position: relative;
    }
    .summary-split {
      display: flex; gap: 12px; margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border-2);
      position: relative;
    }
    .summary-split > div { flex: 1; min-width: 0; }
    .summary-split .col-label {
      font-family: 'Inter'; font-weight: 600; font-size: 10px;
      color: var(--text-mute); text-transform: uppercase; letter-spacing: .08em;
    }
    .summary-split .col-amt {
      font-family: 'Manrope'; font-weight: 800;
      font-size: 17px; letter-spacing: -.01em;
      margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .summary-split .col-amt.pos { color: var(--primary); }
    .summary-split .col-amt.neg { color: var(--negative); }

    /* ---------- "I am" self bar ---------- */
    .self-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 12px;
      gap: 10px;
    }
    .self-bar .self-label {
      font-family: 'Inter'; font-weight: 500; font-size: 12px;
      color: var(--text-mute); letter-spacing: .04em; text-transform: uppercase;
    }
    .self-bar .self-current {
      font-family: 'Manrope'; font-weight: 700; font-size: 14px;
      color: var(--text);
      display: inline-flex; align-items: center; gap: 8px;
      flex: 1;
      overflow: hidden;
    }
    .self-bar button {
      font-family: 'Inter'; font-weight: 600; font-size: 12px;
      color: var(--primary);
      padding: 6px 12px; border-radius: 999px;
      background: rgba(0,229,160,.1);
      border: 1px solid rgba(0,229,160,.2);
    }
    .self-bar button:hover { background: rgba(0,229,160,.18); }

    /* ---------- Row / list ---------- */
    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-3);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .08s ease;
      overflow: hidden;
      position: relative;
    }
    .row + .row { margin-top: 10px; }
    .row:hover { background: var(--surface-2); border-color: var(--border-2); }
    .row:active { transform: scale(.99); }
    .row::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent-color, var(--primary));
      opacity: .8;
    }

    .row-emoji {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent-color, var(--primary)) 0%, color-mix(in srgb, var(--accent-color, var(--primary)) 60%, #000) 100%);
      box-shadow: 0 6px 16px color-mix(in srgb, var(--accent-color, var(--primary)) 30%, transparent);
    }
    .row-main { flex: 1; min-width: 0; }
    .row-title {
      font-family: 'Manrope'; font-weight: 700; font-size: 16px;
      letter-spacing: -.01em; color: var(--text);
      margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row-sub {
      font-family: 'Inter'; font-weight: 500; font-size: 12px;
      color: var(--text-mute); margin: 4px 0 0;
      text-transform: uppercase; letter-spacing: .04em;
    }

    .row-balance { text-align: right; flex-shrink: 0; }
    .row-balance .b-label {
      font-family: 'Inter'; font-weight: 500; font-size: 10px;
      color: var(--text-mute); text-transform: uppercase; letter-spacing: .06em;
    }
    .row-balance .b-amt {
      font-family: 'Manrope'; font-weight: 800; font-size: 16px;
      letter-spacing: -.02em; margin-top: 2px;
    }
    .row-balance .b-amt.pos { color: var(--primary); }
    .row-balance .b-amt.neg { color: var(--negative); }
    .row-balance .b-amt.zero { color: var(--text-mute); }

    /* ---------- Empty states ---------- */
    .empty { text-align: center; padding: var(--s-6) var(--s-3); }
    .empty .emoji-bubble {
      width: 88px; height: 88px;
      border-radius: 28px;
      margin: 0 auto var(--s-2);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 44px;
      background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
    }
    .empty h3 {
      font-family: 'Manrope'; font-weight: 700;
      font-size: 20px; letter-spacing: -.02em;
      margin: 0 0 6px; color: var(--text);
    }
    .empty p {
      font-family: 'Inter'; font-weight: 400; font-size: 14px;
      color: var(--text-soft); margin: 0; max-width: 280px; margin-inline: auto;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; height: 52px; padding: 0 22px;
      border-radius: var(--r-2);
      font-family: 'Manrope'; font-weight: 700; font-size: 15px;
      letter-spacing: -.01em;
      transition: transform .08s ease, background .15s ease, box-shadow .15s ease, opacity .15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: #0A1A14;
      box-shadow: var(--shadow-glow);
    }
    .btn-primary:hover { background: var(--primary-2); }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-2); }

    .btn-soft {
      background: rgba(0,229,160,.10);
      color: var(--primary);
      border: 1px solid rgba(0,229,160,.25);
    }
    .btn-soft:hover { background: rgba(0,229,160,.18); }

    .btn-danger {
      background: rgba(255,77,109,.10);
      color: var(--negative);
      border: 1px solid rgba(255,77,109,.25);
    }
    .btn-danger:hover { background: rgba(255,77,109,.20); }

    .btn-full { width: 100%; }

    .fab {
      position: fixed; bottom: calc(var(--s-3) + env(safe-area-inset-bottom, 0px));
      right: 50%;
      transform: translateX(calc(var(--app-max) / 2 - 76px));
      width: 60px; height: 60px;
      border-radius: 999px;
      background: var(--primary); color: #0A1A14;
      box-shadow: 0 0 0 1px rgba(0,229,160,.4), 0 12px 32px rgba(0,229,160,.4), 0 4px 12px rgba(0,0,0,.4);
      display: inline-flex; align-items: center; justify-content: center;
      z-index: 15;
      transition: transform .12s ease, background .15s ease;
    }
    .fab:hover { background: var(--primary-2); }
    .fab:active { transform: translateX(calc(var(--app-max) / 2 - 76px)) scale(.94); }
    @media (max-width: 520px) {
      .fab { right: var(--s-3); transform: none; }
      .fab:active { transform: scale(.94); }
    }

    /* ---------- Avatars ---------- */
    .avatar {
      width: 36px; height: 36px;
      border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: 'Manrope'; font-weight: 700; font-size: 13px;
      color: #FFFFFF;
      flex-shrink: 0;
      letter-spacing: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
    }
    .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
    .avatar.lg { width: 56px; height: 56px; font-size: 18px; border-radius: 999px; }

    /* ---------- Member pills / chips ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: 'Manrope'; font-weight: 600; font-size: 13px;
      color: var(--text-soft);
      transition: all .15s ease;
      min-height: 38px;
    }
    .chip.selectable { cursor: pointer; }
    .chip.selectable:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
    .chip.active {
      background: var(--primary); border-color: var(--primary); color: #0A1A14;
    }
    .chip.active.soft {
      background: var(--primary-soft); border-color: rgba(0,229,160,.4); color: var(--primary);
    }

    .chip-member {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 14px 4px 4px;
      border-radius: 999px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      font-family: 'Manrope'; font-weight: 600; font-size: 13px;
      color: var(--text);
      transition: all .15s ease;
      min-height: 40px;
      cursor: pointer;
    }
    .chip-member:hover { border-color: var(--border-2); background: var(--surface-2); }
    .chip-member.active {
      background: rgba(0,229,160,.10);
      border-color: rgba(0,229,160,.4);
      color: var(--primary);
    }
    .chip-member.selected-pay {
      background: var(--primary); border-color: var(--primary); color: #0A1A14;
    }
    .chip-member .you-tag {
      font-size: 10px; color: var(--primary); font-weight: 800;
      letter-spacing: .04em;
    }
    .chip-member.selected-pay .you-tag { color: #0A1A14; }

    .member-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 12px 4px 4px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: 'Manrope'; font-weight: 600; font-size: 13px;
      color: var(--text);
      min-height: 40px;
    }
    .member-pill .x {
      font-family: 'Inter'; font-weight: 500; font-size: 13px;
      color: var(--text-mute); padding: 0 4px;
    }
    .member-pill .x:hover { color: var(--negative); }

    /* ---------- Tabs (segmented) ---------- */
    .tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px;
      margin: var(--s-2) 0;
    }
    .tab {
      flex: 1; height: 40px;
      border-radius: 999px;
      font-family: 'Manrope'; font-weight: 600; font-size: 13px;
      color: var(--text-mute);
      transition: background .15s ease, color .15s ease;
    }
    .tab.active {
      background: linear-gradient(180deg, var(--surface-3) 0%, var(--surface-2) 100%);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* ---------- Amounts ---------- */
    .amt { font-family: 'Manrope'; font-weight: 800; letter-spacing: -.02em; }
    .amt-xl { font-size: 28px; letter-spacing: -.03em; }
    .amt-lg { font-size: 22px; }
    .amt-md { font-size: 17px; }
    .amt-sm { font-size: 14px; }
    .amt.pos { color: var(--primary); }
    .amt.neg { color: var(--negative); }
    .amt.zero { color: var(--text-mute); }

    /* ---------- Forms ---------- */
    .field { margin-bottom: var(--s-2); }
    .field-label {
      display: block;
      font-family: 'Inter'; font-weight: 600;
      font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-mute); margin-bottom: 8px;
    }
    .amount-input-wrap { position: relative; }
    .amount-input-wrap::before {
      content: '₹';
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      font-family: 'Manrope'; font-weight: 800; font-size: 22px;
      color: var(--text-mute); pointer-events: none;
    }
    .amount-input {
      font-family: 'Manrope'; font-weight: 800; font-size: 26px;
      letter-spacing: -.02em;
      padding-left: 40px;
    }
    .split-hint {
      font-family: 'Inter'; font-weight: 500; font-size: 12px;
      color: var(--primary); margin-top: 8px; padding-left: 4px;
    }

    /* ---------- Pickers ---------- */
    .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
    .swatch {
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
    }
    .swatch.active {
      border-color: var(--text);
      transform: scale(1.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 4px 14px rgba(0,0,0,.4);
    }
    .emoji-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .emoji-cell {
      height: 42px; border-radius: var(--r-1); font-size: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .12s ease;
    }
    .emoji-cell:hover { background: var(--surface-2); }
    .emoji-cell.active { background: rgba(0,229,160,.15); }

    /* ---------- Bottom sheet ---------- */
    .scrim {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(8px);
      z-index: 50;
      animation: fade-in .2s ease;
    }
    .sheet {
      position: fixed; left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: 100%; max-width: var(--app-max);
      background: var(--bg-soft);
      border: 1px solid var(--border-2);
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -20px 60px rgba(0,0,0,.6);
      z-index: 60;
      max-height: 92vh;
      display: flex; flex-direction: column;
      animation: slide-up .25s cubic-bezier(.2,.8,.25,1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .sheet-handle {
      width: 44px; height: 4px;
      background: var(--border-2);
      border-radius: 999px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--s-1) var(--s-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sheet-title {
      font-family: 'Manrope'; font-weight: 700;
      font-size: 17px; letter-spacing: -.01em;
      margin: 0;
    }
    .sheet-cancel, .sheet-save {
      font-family: 'Manrope'; font-weight: 600; font-size: 14px;
      padding: 8px 10px; border-radius: 8px;
    }
    .sheet-cancel { color: var(--text-mute); }
    .sheet-cancel:hover { background: var(--surface); color: var(--text); }
    .sheet-save { color: var(--primary); }
    .sheet-save:hover { background: rgba(0,229,160,.1); }
    .sheet-save:disabled { color: var(--text-faint); background: transparent; cursor: not-allowed; }

    .sheet-body { padding: var(--s-2); overflow-y: auto; -webkit-overflow-scrolling: touch; }

    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-up { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

    /* ---------- Toast ---------- */
    .toast-stack {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%; transform: translateX(-50%);
      z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
      width: calc(100% - 24px); max-width: 380px;
    }
    .toast {
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      color: var(--text);
      padding: 12px 16px;
      border-radius: var(--r-2);
      font-family: 'Inter'; font-weight: 500; font-size: 13px;
      box-shadow: 0 12px 32px rgba(0,0,0,.5);
      animation: toast-in .25s cubic-bezier(.2,.8,.25,1);
      pointer-events: auto;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.success { border-color: rgba(0,229,160,.35); }
    .toast.success .toast-icon { color: var(--primary); }
    .toast.error   { border-color: rgba(255,77,109,.35); }
    .toast.error .toast-icon { color: var(--negative); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Expense row ---------- */
    .exp-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-2);
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .exp-row + .exp-row { margin-top: 8px; }
    .exp-row:hover { background: var(--surface-2); border-color: var(--border-2); }

    .exp-cat {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .exp-main { flex: 1; min-width: 0; }
    .exp-desc {
      font-family: 'Manrope'; font-weight: 600; font-size: 15px;
      color: var(--text); margin: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .exp-payer {
      font-family: 'Inter'; font-weight: 500; font-size: 11px;
      color: var(--text-mute); margin: 4px 0 0;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .exp-side { text-align: right; flex-shrink: 0; min-width: 90px; }
    .exp-side .you-line {
      font-family: 'Manrope'; font-weight: 800; font-size: 15px;
      letter-spacing: -.01em;
    }
    .exp-side .you-line.pos { color: var(--primary); }
    .exp-side .you-line.neg { color: var(--negative); }
    .exp-side .you-line.zero { color: var(--text-mute); }
    .exp-side .you-label {
      font-family: 'Inter'; font-weight: 500; font-size: 10px;
      color: var(--text-mute); text-transform: uppercase; letter-spacing: .06em;
      margin-top: 2px;
    }
    .exp-side .total {
      font-family: 'Inter'; font-weight: 500; font-size: 10px;
      color: var(--text-mute); text-transform: uppercase; letter-spacing: .06em;
    }
    .exp-side .total-amt {
      font-family: 'Manrope'; font-weight: 700; font-size: 15px;
      color: var(--text); margin-top: 2px;
    }

    /* ---------- Balance / settle ---------- */
    .balance-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-2);
    }
    .balance-row + .balance-row { margin-top: 8px; }
    .balance-row .name {
      font-family: 'Manrope'; font-weight: 600; font-size: 15px;
      color: var(--text);
    }
    .balance-row .status {
      font-family: 'Inter'; font-weight: 500; font-size: 10px;
      color: var(--text-mute); margin-top: 2px;
      text-transform: uppercase; letter-spacing: .08em;
    }

    .settle-row {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-2);
    }
    .settle-row + .settle-row { margin-top: 8px; }
    .settle-row .who {
      font-family: 'Manrope'; font-weight: 600; font-size: 14px;
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .settle-row .arrow { color: var(--primary); flex-shrink: 0; }
    .settle-row .pay-amt {
      margin-left: auto;
      font-family: 'Manrope'; font-weight: 800; font-size: 15px;
      letter-spacing: -.02em; color: var(--primary);
    }

    /* ---------- Settings ---------- */
    .settings-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-2);
      gap: 12px;
    }
    .settings-item + .settings-item { margin-top: 8px; }
    .settings-item .label {
      font-family: 'Manrope'; font-weight: 600; font-size: 15px;
      color: var(--text);
    }
    .settings-item .desc {
      font-family: 'Inter'; font-weight: 400; font-size: 12px;
      color: var(--text-mute); margin-top: 2px;
    }
    .coming-soon, .badge-ok, .badge-warn {
      font-family: 'Inter'; font-weight: 600; font-size: 10px;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      flex-shrink: 0;
    }
    .coming-soon { color: var(--gold); background: rgba(255,200,87,.1); border: 1px solid rgba(255,200,87,.25); }
    .badge-ok    { color: var(--primary); background: var(--primary-soft); border: 1px solid rgba(0,229,160,.3); }
    .badge-warn  { color: var(--gold); background: rgba(255,200,87,.1); border: 1px solid rgba(255,200,87,.25); }

    /* ---------- Helpers ---------- */
    .spacer-1 { height: var(--s-1); }
    .spacer-2 { height: var(--s-2); }
    .spacer-3 { height: var(--s-3); }
    .spacer-fab { height: 96px; }

    .code-block {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-2);
      padding: 12px 14px;
      font-size: 11px;
      color: var(--text-soft);
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre;
    }

    @media (max-width: 360px) {
      .summary .net { font-size: 34px; }
    }

    /* ---------- Confetti celebration ---------- */
    .confetti-stage {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 200;
      overflow: hidden;
    }
    .confetti {
      position: absolute;
      top: -20px;
      width: 10px; height: 16px;
      animation: confetti-fall var(--dur, 2.5s) cubic-bezier(.3,.7,.5,1) forwards;
      transform-origin: center;
      opacity: 0;
    }
    @keyframes confetti-fall {
      0%   { transform: translate(0, -10vh) rotate(0deg);     opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translate(var(--x, 30px), 110vh) rotate(var(--rot, 720deg)); opacity: 0; }
    }
    .celebrate-banner {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 201;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(0,229,160,.18) 0%, rgba(110,91,255,.18) 100%);
      border: 1px solid rgba(0,229,160,.5);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 60px rgba(0,229,160,.3);
      animation: celebrate-pop .5s cubic-bezier(.2,1.6,.3,1) forwards, celebrate-fade 2.5s ease-out forwards;
    }
    .celebrate-banner h2 {
      font-family: 'Manrope'; font-weight: 800;
      font-size: 28px; letter-spacing: -.02em;
      color: var(--text); margin: 0;
    }
    .celebrate-banner p {
      font-family: 'Inter'; font-weight: 500; font-size: 14px;
      color: var(--text-soft); margin: 6px 0 0;
    }
    @keyframes celebrate-pop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes celebrate-fade {
      0%, 70% { opacity: 1; }
      100%    { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Supabase JS is lazy-loaded by db.js only when the user connects.
       Keeping it out of the critical path means a broken/slow CDN response
       can't blank the page in local-only mode. -->

  <!-- Optional built-in cloud credentials. If config.js is missing (404),
       the page works fine in local mode. If present with values, friends
       who open the deployed URL get auto-connected on first paint. -->
  <script src="config.js"></script>
  <script src="db.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback } = React;
    const DB = window.SplitProDB;

    const SELF_KEY = 'splitpro_self_v1';
    const UPI_KEY  = 'splitpro_upi_v1';   // { memberName: upiId }

    // ---------- UPI helpers ----------
    function loadUpiMap() {
      try { return JSON.parse(localStorage.getItem(UPI_KEY) || '{}'); } catch { return {}; }
    }
    function saveUpiMap(obj) { localStorage.setItem(UPI_KEY, JSON.stringify(obj)); }

    // RFC-style UPI URI: upi://pay?pa=<vpa>&pn=<name>&am=<amount>&cu=INR&tn=<note>
    function buildUpiUri({ vpa, name, amount, note }) {
      const params = new URLSearchParams();
      params.set('pa', vpa);
      params.set('pn', name);
      params.set('am', String(Number(amount).toFixed(2)));
      params.set('cu', 'INR');
      if (note) params.set('tn', note);
      return 'upi://pay?' + params.toString();
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    }

    const CATEGORIES = [
      { id: 'food',     label: 'Food',     emoji: '🍔' },
      { id: 'travel',   label: 'Travel',   emoji: '✈️' },
      { id: 'stay',     label: 'Stay',     emoji: '🏨' },
      { id: 'drinks',   label: 'Drinks',   emoji: '🍹' },
      { id: 'fun',      label: 'Fun',      emoji: '🎉' },
      { id: 'shopping', label: 'Shopping', emoji: '🛍️' },
      { id: 'fuel',     label: 'Fuel',     emoji: '⛽' },
      { id: 'other',    label: 'Other',    emoji: '📌' },
    ];
    const CAT_BY_ID = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));
    const GROUP_EMOJIS = ['👥','🏖️','🏠','🎓','💼','❤️','🍕','🎬','🚗','⚽','✈️','🏔️','🎵','☕','🍻','🌴'];
    const TRIP_EMOJIS  = ['🏖️','✈️','🏔️','🚗','🏠','🎉','🍽️','💼','🌴','🎬','🛍️','⛺','🏛️','🎢','🚂','⛵'];
    const COLORS = ['#00E5A0','#6E5BFF','#FF4D6D','#FFC857','#3DA9FC','#FF7AB6','#3FE0D0','#FFA740'];
    const AVATAR_COLORS = [
      ['#00E5A0','#00B080'],['#6E5BFF','#5040C8'],['#FF4D6D','#C9304E'],['#FFC857','#D9A030'],
      ['#3DA9FC','#2380D0'],['#FF7AB6','#D9568F'],['#3FE0D0','#28A89A'],['#FFA740','#D9821C'],
      ['#A78BFA','#7C5CD9'],['#34D399','#10B981'],['#F472B6','#DB2777'],['#60A5FA','#3B82F6'],
    ];

    const inrFmt  = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    const inrFmt2 = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 });
    const fmtINR  = (n, decimals=false) => (decimals ? inrFmt2 : inrFmt).format(Number(n) || 0);
    const fmtDate = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const todayISO = () => new Date().toISOString().slice(0, 10);

    function hashStr(s) {
      let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xfffffff;
      return h;
    }

    // Read a File, downscale to maxDim px, return base64 JPEG data URL.
    // Keeps photos under ~120 KB so they're safe to embed in DB rows.
    function compressImage(file, maxDim = 1024, quality = 0.72) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          reject(new Error('Please pick an image file'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Failed to decode image'));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              const ratio = width > height ? maxDim / width : maxDim / height;
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            try {
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(dataUrl);
            } catch (e) { reject(e); }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function avatarColors(name) { return AVATAR_COLORS[hashStr(name) % AVATAR_COLORS.length]; }
    function initials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function Avatar({ name, size = 'md' }) {
      const [a, b] = avatarColors(name);
      return (
        <span
          className={`avatar ${size === 'sm' ? 'sm' : size === 'lg' ? 'lg' : ''}`}
          style={{ background: `linear-gradient(135deg, ${a} 0%, ${b} 100%)` }}
          title={name}
        >
          {initials(name)}
        </span>
      );
    }

    function loadSelf() {
      try { return JSON.parse(localStorage.getItem(SELF_KEY) || '{}'); } catch { return {}; }
    }
    function saveSelf(obj) { localStorage.setItem(SELF_KEY, JSON.stringify(obj)); }

    function expenseShares(e) {
      // Returns { name: amount } for what each member owes on this expense.
      // If `shares` is set on the expense, use those exact amounts.
      // Otherwise fall back to equal split across split_among.
      const amt = Number(e.amount) || 0;
      if (e.shares && typeof e.shares === 'object' && Object.keys(e.shares).length > 0) {
        const out = {};
        for (const [k, v] of Object.entries(e.shares)) out[k] = Number(v) || 0;
        return out;
      }
      const splitters = Array.isArray(e.split_among) ? e.split_among : [];
      if (splitters.length === 0) return {};
      const each = amt / splitters.length;
      const out = {};
      for (const s of splitters) out[s] = each;
      return out;
    }

    function calcBalances(expenses) {
      const totals = new Map();
      const ensure = (n) => { if (!totals.has(n)) totals.set(n, 0); };
      for (const e of expenses) {
        const amt = Number(e.amount) || 0;
        const shares = expenseShares(e);
        if (Object.keys(shares).length === 0) continue;
        ensure(e.paid_by);
        totals.set(e.paid_by, totals.get(e.paid_by) + amt);
        for (const [name, share] of Object.entries(shares)) {
          ensure(name);
          totals.set(name, totals.get(name) - share);
        }
      }
      return [...totals.entries()].map(([name, net]) => ({ name, net })).sort((a, b) => b.net - a.net);
    }
    function calcSettlements(balances) {
      const eps = 0.01;
      const creditors = balances.filter((b) => b.net >  eps).map((b) => ({ ...b }));
      const debtors   = balances.filter((b) => b.net < -eps).map((b) => ({ ...b, net: -b.net }));
      creditors.sort((a, b) => b.net - a.net); debtors.sort((a, b) => b.net - a.net);
      const transfers = []; let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const d = debtors[i], c = creditors[j];
        const amt = Math.min(d.net, c.net);
        transfers.push({ from: d.name, to: c.name, amount: amt });
        d.net -= amt; c.net -= amt;
        if (d.net < eps) i++;
        if (c.net < eps) j++;
      }
      return transfers;
    }
    function youLine(e, self) {
      if (!self) return null;
      const shares = expenseShares(e);
      const myShare = shares[self];
      const isPayer = e.paid_by === self;
      const isSplitter = myShare != null;
      if (!isPayer && !isSplitter) return null;
      let net = 0;
      if (isPayer) net += Number(e.amount) || 0;
      if (isSplitter) net -= myShare;
      return net;
    }

    function useToasts() {
      const [toasts, setToasts] = useState([]);
      const push = useCallback((message, type = 'default') => {
        const id = Math.random().toString(36).slice(2);
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 2500);
      }, []);
      return { toasts, push };
    }
    // CSS-only confetti. Fires once, parent removes after animation.
    function Celebration({ message }) {
      const confetti = useMemo(() => {
        const colors = ['#00E5A0', '#6E5BFF', '#FFC857', '#FF4D6D', '#3DA9FC', '#FF7AB6'];
        const arr = [];
        for (let i = 0; i < 80; i++) {
          arr.push({
            id: i,
            left: Math.random() * 100,
            x: (Math.random() - 0.5) * 240,
            rot: 360 + Math.random() * 720,
            dur: 2 + Math.random() * 1.6,
            delay: Math.random() * 0.4,
            color: colors[i % colors.length],
            size: 6 + Math.random() * 10,
          });
        }
        return arr;
      }, []);
      return (
        <React.Fragment>
          <div className="confetti-stage" aria-hidden="true">
            {confetti.map((c) => (
              <span
                key={c.id}
                className="confetti"
                style={{
                  left: c.left + '%',
                  background: c.color,
                  width: c.size + 'px',
                  height: (c.size * 1.6) + 'px',
                  animationDelay: c.delay + 's',
                  '--x': c.x + 'px',
                  '--rot': c.rot + 'deg',
                  '--dur': c.dur + 's',
                }}
              />
            ))}
          </div>
          <div className="celebrate-banner">
            <div style={{ fontSize: 56, marginBottom: 4 }}>🎉</div>
            <h2>All squared up!</h2>
            <p>{message || 'Everyone\'s settled — enjoy the trip.'}</p>
          </div>
        </React.Fragment>
      );
    }

    function ToastStack({ toasts }) {
      return (
        <div className="toast-stack">
          {toasts.map((t) => (
            <div key={t.id} className={`toast ${t.type}`}>
              <span className="toast-icon">{t.type === 'success' ? '✓' : t.type === 'error' ? '!' : '·'}</span>
              <span>{t.message}</span>
            </div>
          ))}
        </div>
      );
    }

    const Icon = {
      Plus: (p) => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      Back: (p) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="15 18 9 12 15 6"/></svg>,
      Gear: (p) => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
